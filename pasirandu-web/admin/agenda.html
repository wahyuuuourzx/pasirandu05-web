<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agenda - Pasirandu 05</title>

    <link rel="stylesheet" href="agenda.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

    <div class="brand">

        <div class="brand-logo">
            P05
        </div>

        <div>
            <h2>Pasirandu 05</h2>
            <span>Admin Panel</span>
        </div>

    </div>

    <nav class="menu">

        <a href="./dashboard.html">
            <span>⌂</span>
            Dashboard
        </a>

        <a href="./anggota.html">
            <span>👥</span>
            Anggota
        </a>

        <a href="./kegiatan.html">
            <span>📅</span>
            Kegiatan
        </a>

        <a href="./galeri.html">
            <span>📷</span>
            Galeri
        </a>

        <a href="./agenda.html" class="active">
            <span>📋</span>
            Agenda
        </a>
        
        <a href="./pesan.html">
            <span>💬</span>
            Pesan
        </a>

        <a href="./pengaturan.html">
            <span>⚙</span>
            Pengaturan
        </a>

    </nav>

    <button id="logoutBtn" class="logout-btn">
        ⇥ Keluar
    </button>

</aside>


    <!-- MAIN -->
    <main class="main-content">

        <!-- TOPBAR -->
        <header class="topbar">

            <div>
                <h1>Agenda</h1>
                <p>Kelola agenda Pemuda-Pemudi Pasirandu 05</p>
            </div>

            <div class="admin-profile">

                <div class="profile-avatar">
                    A
                </div>

                <div>
                    <strong>Admin</strong>
                    <span>Administrator</span>
                </div>

            </div>

        </header>


        <!-- ACTION BAR -->
        <section class="action-bar">

            <div class="search-box">

                <span>⌕</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Cari agenda..."
                >

            </div>

            <button
                id="addAgendaBtn"
                class="add-btn"
            >
                + Tambah Agenda
            </button>

        </section>


        <!-- AGENDA CARD -->
        <section class="agenda-card">

            <div class="card-header">

                <div>
                    <h2>Daftar Agenda</h2>

                    <p>
                        Agenda dan jadwal kegiatan Pasirandu 05
                    </p>
                </div>

                <div class="total-agenda">

                    <strong id="totalAgenda">
                        0
                    </strong>

                    <span>Agenda</span>

                </div>

            </div>


            <!-- AGENDA LIST -->
            <div
                id="agendaList"
                class="agenda-list"
            >

            </div>

        </section>

    </main>


    <!-- MODAL -->
    <div
        id="agendaModal"
        class="modal"
    >

        <div class="modal-content">

            <div class="modal-header">

                <div>
                    <h2 id="modalTitle">
                        Tambah Agenda
                    </h2>

                    <p>
                        Tambahkan agenda baru
                    </p>
                </div>

                <button
                    id="closeModal"
                    class="close-btn"
                >
                    ×
                </button>

            </div>


            <form id="agendaForm">

                <input
                    type="hidden"
                    id="agendaIndex"
                >


                <div class="form-group">

                    <label for="judul">
                        Nama Agenda
                    </label>

                    <input
                        type="text"
                        id="judul"
                        placeholder="Contoh: Rapat Pemuda-Pemudi"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="tanggal">
                            Tanggal
                        </label>

                        <input
                            type="date"
                            id="tanggal"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="waktu">
                            Waktu
                        </label>

                        <input
                            type="time"
                            id="waktu"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="lokasi">
                        Lokasi
                    </label>

                    <input
                        type="text"
                        id="lokasi"
                        placeholder="Contoh: Balai Pasirandu 05"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="deskripsi">
                        Deskripsi
                    </label>

                    <textarea
                        id="deskripsi"
                        rows="4"
                        placeholder="Deskripsi agenda..."
                    ></textarea>

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn"
                    >
                        Batal
                    </button>

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Simpan Agenda
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="agenda.js"></script>

</body>
</html>
